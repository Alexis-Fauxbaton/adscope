# Blueprint Render — décidé le 2026-09-26. Un seul service web, une seule
# instance (les plafonds anti-abus vivent en mémoire, api/DEPLOY.md), une base
# Postgres, un cron pour l'email du matin. Région Francfort : données de
# marchands français, hébergement dans l'UE (politique de confidentialité).
#
# Les valeurs `sync: false` se posent dans le tableau de bord Render, jamais ici :
# le domaine public et l'adresse de l'opérateur ne sont pas des choses du dépôt.
services:
  - type: web
    name: adscope-api
    runtime: python
    region: frankfurt
    plan: starter
    branch: feat/api
    rootDir: api
    numInstances: 1
    healthCheckPath: /app/
    buildCommand: pip install uv && uv sync --frozen
    # La migration tourne avant chaque mise en ligne, jamais au démarrage :
    # scripts/migrate.py est idempotent (create_all + registre).
    preDeployCommand: uv run python scripts/migrate.py
    # `--forwarded-allow-ips='*'` : sur Render l'instance n'est joignable que par
    # le proxy Render, aucun client ne parle directement à uvicorn — la forge
    # d'X-Forwarded-For que redoute api/DEPLOY.md n'a pas de chemin. La plage
    # exacte du proxy n'est pas publiée par Render.
    startCommand: >-
      uv run uvicorn adscope_api.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - fromGroup: adscope-config
      - key: DATABASE_URL
        fromDatabase:
          name: adscope-db
          property: connectionString

  # L'email du matin (lot F1) : 05:00 UTC = 7 h à Paris en été, 6 h en hiver.
  # Idempotent (UNIQUE(account_id, day)) : le rejouer n'envoie rien de plus.
  - type: cron
    name: adscope-digests
    runtime: python
    region: frankfurt
    plan: starter
    branch: feat/api
    rootDir: api
    schedule: "0 5 * * *"
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run python -m scripts.send_digests
    envVars:
      - fromGroup: adscope-config
      - key: DATABASE_URL
        fromDatabase:
          name: adscope-db
          property: connectionString

envVarGroups:
  - name: adscope-config
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ADSCOPE_ENV
        value: production
      - key: ADSCOPE_TRUSTED_PROXY
        value: "1"
      # https://<domaine> — le service refuse de démarrer sans https.
      - key: ADSCOPE_PUBLIC_URL
        sync: false
      # Le seul compte qui ouvre les files de machine par cookie.
      - key: ADSCOPE_OPERATOR_EMAIL
        sync: false

databases:
  - name: adscope-db
    databaseName: adscope
    user: adscope
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: []
