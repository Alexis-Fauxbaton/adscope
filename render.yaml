# Blueprint Render — décidé le 2026-09-26. Un projet « adscope », un environnement
# « production » : un seul service web à une instance (les plafonds anti-abus
# vivent en mémoire, api/DEPLOY.md) et une base Postgres. Région Francfort :
# données de marchands français, hébergement dans l'UE. Pas de cron facturé à
# l'usage : l'email du matin partira d'un planificateur interne au service web.
#
# Les valeurs `sync: false` se posent dans le tableau de bord Render, jamais ici :
# le domaine public et l'adresse de l'opérateur ne sont pas des choses du dépôt.
projects:
  - name: adscope
    environments:
      - name: production
        services:
          - type: web
            name: adscope-api
            runtime: python
            region: frankfurt
            plan: starter
            branch: feat/api
            rootDir: api
            numInstances: 1
            # `/healthz` : sans base ni authentification (api/adscope_api/digest_runs.py).
            # `/app/` avant elle frappait les fichiers statiques toutes les 5 s pour rien.
            healthCheckPath: /healthz
            buildCommand: pip install uv && uv sync --frozen
            # La migration tourne avant chaque mise en ligne, jamais au démarrage :
            # scripts/migrate.py est idempotent (create_all + registre).
            preDeployCommand: uv run python scripts/migrate.py
            # `--forwarded-allow-ips='*'` : sur Render l'instance n'est joignable que
            # par le proxy Render, aucun client ne parle directement à uvicorn — la
            # forge d'X-Forwarded-For que redoute api/DEPLOY.md n'a pas de chemin.
            startCommand: >-
              uv run uvicorn adscope_api.main:app --host 0.0.0.0 --port $PORT
              --proxy-headers --forwarded-allow-ips='*'
            envVars:
              - fromGroup: adscope-config
              - key: DATABASE_URL
                fromDatabase:
                  name: adscope-db
                  property: connectionString
        databases:
          - name: adscope-db
            databaseName: adscope
            user: adscope
            region: frankfurt
            plan: basic-256mb
            postgresMajorVersion: "17"
            ipAllowList: []

envVarGroups:
  - name: adscope-config
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ADSCOPE_ENV
        value: production
      - key: ADSCOPE_TRUSTED_PROXY
        value: "1"
      # https://<domaine> — le service refuse de démarrer sans https.
      - key: ADSCOPE_PUBLIC_URL
        sync: false
      # Le seul compte qui ouvre les files de machine par cookie.
      - key: ADSCOPE_OPERATOR_EMAIL
        sync: false
