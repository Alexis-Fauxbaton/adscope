<!doctype html>
<meta charset="utf-8" />
<title>adscope</title>
<link rel="stylesheet" href="popup.css" />

<header class="head">
  <p class="brand"><span id="brand-mark" aria-hidden="true"></span>adscope</p>
  <p id="site" class="site"></p>
</header>

<!--
  Ce que l'extension ne peut pas faire, et le geste qui le répare : une phrase
  et un bouton par problème, au-dessus de tout le reste. Rien quand tout va bien.
-->
<section id="alerts" hidden></section>

<!-- Le compte, et le seul geste qu'un humain fait ici : ouvrir l'application. -->
<section class="card card--row">
  <p id="account" class="account" hidden></p>
  <button id="open-app" class="primary">Se connecter</button>
</section>

<!--
  Sur une fiche : le résumé qu'on cite de mémoire, et le suivi. Ni courbe ni
  tableau ni vendeur — le panneau les porte déjà dans la page, sous les yeux
  du lecteur. La fenêtre ne sert qu'à ce que la page ne montre pas.
-->
<section id="fiche" class="card" hidden>
  <p id="fiche-line" class="summary"></p>
  <button id="follow" class="follow">Suivre</button>
</section>

<p id="empty" class="hint" hidden></p>

<!--
  Le dépannage : réglages, et sous un second repli le diagnostic. Accessible,
  jamais au premier plan — c'est un outil, pas le produit.
-->
<details id="tools" class="fold">
  <summary class="fold-head">Réglages<span id="dot" class="dot" title="État de la connexion"></span></summary>
  <div class="fold-body">
    <section class="block">
      <p class="label">Adresse de l'API</p>
      <div class="field">
        <input id="api" type="text" spellcheck="false" autocomplete="off" />
        <button id="api-save">Enregistrer</button>
      </div>
      <p id="api-note" class="note" hidden></p>
    </section>

    <section class="block">
      <p class="label">Clé — machines uniquement</p>
      <div id="key-saved" class="field" hidden>
        <code id="key-mask"></code>
        <button id="key-replace" class="ghost">Remplacer</button>
      </div>
      <div id="key-edit" class="field">
        <input id="key" type="text" placeholder="adsc_…" spellcheck="false" autocomplete="off" />
        <button id="key-save">Enregistrer</button>
      </div>
      <p id="key-note" class="note" hidden></p>
    </section>

    <details id="diag" class="fold fold--inner">
      <summary class="fold-head">Diagnostic</summary>
      <div class="fold-body">
        <button id="test" class="wide">Tester la connexion</button>
        <p id="test-note" class="note" hidden></p>

        <p class="label">Dernière page lue</p>
        <div id="state"></div>

        <p class="label">Cache local</p>
        <div id="cache"></div>
        <button id="cache-clear" class="wide ghost">Vider le cache</button>
        <p id="cache-note" class="note" hidden></p>
      </div>
    </details>
  </div>
</details>

<!--
  Le registre et ses modules de site, comme le manifeste les déclare pour les
  content scripts : la fenêtre ne nomme aucun site, elle lui demande les noms
  qu'elle affiche et la liste de ce qui est couvert.
-->
<script src="../src/sites.js"></script>
<script src="../src/sites/read.js"></script>
<script src="../src/sites/leboncoin.js"></script>
<script src="../src/sites/lacentrale.js"></script>
<script src="../src/format.js"></script>
<!-- Le vocabulaire des problèmes, partagé avec le service worker qui les tient. -->
<script src="../src/health.js"></script>
<!-- Le picto de marque : un seul endroit le fabrique, ici comme dans la page. -->
<script src="../src/panel-node.js"></script>
<script src="../src/panel-icons.js"></script>

<script src="dom.js"></script>
<script src="config.js"></script>
<script src="report.js"></script>
<script src="fiche.js"></script>
<script src="account.js"></script>
<script src="alerts.js"></script>
<script src="popup.js"></script>
